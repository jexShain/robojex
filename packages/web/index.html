<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235676e6'/%3E%3Ctext x='16' y='22' font-size='18' font-family='monospace' fill='white' text-anchor='middle'%3Ej%3C/text%3E%3C/svg%3E" />
    <title>jex console</title>
  </head>
  <body>
    <script>
      // Apply the persisted theme before first paint to avoid a light flash.
      // body exists here; theme.ts keeps the attribute in sync afterwards.
      try {
        var pref = localStorage.getItem('robojex-theme') || 'system'
        var dark =
          pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.body.dataset.dsDarkTheme = ''
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
